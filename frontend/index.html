<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ghidra Web · Análisis estático</title><link rel="stylesheet" href="/style.css"></head><body>

<nav class="toolbar compact-toolbar" aria-label="Herramientas y contexto del análisis"><div class="compact-actions"><label class="primary upload icon-action" title="Importar ejecutable"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m-4 4 4-4 4 4M4 15v5h16v-5"/></svg><input id="upload" type="file" aria-label="Importar ejecutable"></label><button id="refresh" class="icon-action" type="button" title="Actualizar proyectos" aria-label="Actualizar proyectos"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M6 7a7 7 0 0 1 12-1l2 6M4 12l2 6a7 7 0 0 0 12-1"/></svg></button><button id="reanalyze" class="icon-action" type="button" title="Regenerar análisis" aria-label="Regenerar análisis"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 11 7-11 7V5ZM4 5v14"/></svg></button><button id="export" class="icon-action" type="button" title="Exportar JSON" aria-label="Exportar JSON"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v12m-4-4 4 4 4-4M4 17v3h16v-3"/></svg></button></div><div class="toolbar-engine"><label class="engine-config">Configuración · Motor <select id="engine-select" aria-label="Motor para nuevos proyectos"><option value="internal">Motor Rust (ARM64 / x86-64)</option><option value="ghidra">Conectar con Ghidra</option></select></label><span id="engine" class="badge">Conectando motor…</span></div><div class="filebar"><strong id="filename">Sin binario</strong><span id="architecture">–</span></div><form id="goto-form" class="navigation"><button id="back" type="button" title="Anterior (Alt + ←)" aria-label="Anterior">←</button><button id="forward" type="button" title="Siguiente (Alt + →)" aria-label="Siguiente">→</button><label>Ir a <input id="goto" placeholder="0x140001000"></label><button type="submit">Ir</button><span id="cursor-xref"></span></form><div id="overview" class="overview">Importa un ejecutable para iniciar el análisis estático.</div><div id="notice" role="status" hidden></div></nav>
<main><aside><section class="projects"><h2>Proyectos <span id="project-count">0</span></h2><div id="projects" class="items"></div></section><section class="functions"><h2>Funciones <span id="function-count">0</span></h2><input id="search" placeholder="Filtrar funciones…"><div id="functions" class="items"></div></section></aside>
<section class="workspace"><section class="bottom"><div class="tabs"><button data-tab="strings" type="button">Strings</button><button data-tab="xref" type="button">Xrefs</button><button data-tab="calls" type="button">Calls</button><button data-tab="imports" type="button">Imports</button><button data-tab="exports" type="button">Exports</button><button data-tab="memory" type="button">Secciones</button><button data-tab="capabilities" type="button">Capacidades</button><button data-tab="flow" type="button">Grafo</button><button data-tab="symbols" type="button">Símbolos</button><button data-tab="variables" type="button">Variables</button><button data-tab="types" type="button">Tipos</button><button data-tab="instructions" type="button">Buscar instrucciones</button><button data-tab="code-search" type="button">Buscar C</button><button data-tab="hex" type="button">Hex</button><button data-tab="bytesearch" type="button">Buscar bytes</button><button data-tab="bookmarks" type="button">Marcadores</button><button data-tab="notes" type="button">Notas</button><button data-tab="edit" type="button">Editar</button><button data-tab="log" type="button">Registro</button></div></section><div class="code-view-switch" role="group" aria-label="Vista del código"><button type="button" data-code-view="listing" aria-pressed="false">Listing</button><button type="button" data-code-view="pseudo" aria-pressed="false">Pseudocódigo</button><button type="button" data-code-view="both" aria-pressed="true">Ambos</button></div><div class="code-grid" id="code-workspace" data-view="both"><section class="panel"><h2>Listing <span id="signature"></span></h2><div id="listing-graph" tabindex="-1" hidden></div><div id="listing-controls"></div><div id="listing" class="code-scroll" tabindex="0"></div></section><section class="panel"><div class="decompile-heading"><h2 id="code-title">Decompilación</h2><span id="code-kind"></span><button id="copy-code" type="button">Copiar</button></div><div id="decompile-status"></div <footer><span id="status">Listo</span><span>STATIC ANALYSIS WORKBENCH</span></footer><script type="module" src="/app.js"></script></body></html>
